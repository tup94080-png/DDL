<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diana - Creative AI Companion</title>
    <style>
        :root {
            --bg-color: #0f1115;
            --card-bg: #181b22;
            --accent-green: #76b900;
            --text-main: #f0f2f5;
            --text-muted: #8a99ad;
            --user-msg: #262c38;
            --diana-msg: #111318;
            --border-color: #262b36;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            height: 100vh;
        }

        .chat-container {
            width: 100%;
            max-width: 650px;
            background: var(--card-bg);
            display: flex;
            flex-direction: column;
            height: 100vh;
            border-left: 1px solid var(--border-color);
            border-right: 1px solid var(--border-color);
        }

        .header {
            padding: 16px;
            border-bottom: 1px solid var(--border-color);
            text-align: center;
            background: #14171d;
        }

        .header h2 {
            margin: 0;
            color: var(--accent-green);
            font-size: 1.3rem;
        }

        .header p {
            margin: 4px 0 0;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .chat-box {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .message {
            max-width: 82%;
            padding: 12px 16px;
            border-radius: 14px;
            font-size: 0.95rem;
            line-height: 1.5;
            word-wrap: break-word;
        }

        .message.user {
            align-self: flex-end;
            background: var(--user-msg);
            color: #fff;
            border-bottom-right-radius: 2px;
        }

        .message.diana {
            align-self: flex-start;
            background: var(--diana-msg);
            border: 1px solid #2e3646;
            color: var(--text-main);
            border-bottom-left-radius: 2px;
        }

        .image-card {
            margin-top: 10px;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #2e3646;
            background: #000;
        }

        .image-card img {
            width: 100%;
            height: auto;
            display: block;
        }

        .download-btn {
            display: block;
            margin: 8px 0 0;
            padding: 8px 12px;
            background: var(--accent-green);
            color: #000;
            font-weight: bold;
            text-align: center;
            text-decoration: none;
            border-radius: 6px;
            font-size: 0.85rem;
        }

        .input-area {
            padding: 12px;
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 8px;
            background: #14171d;
        }

        input {
            flex: 1;
            padding: 12px;
            background: #0f1115;
            border: 1px solid #2e3646;
            border-radius: 10px;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
        }

        input:focus {
            border-color: var(--accent-green);
        }

        button {
            padding: 12px 20px;
            background: var(--accent-green);
            color: #000;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.95rem;
        }

        button:active {
            opacity: 0.8;
        }

        .loading {
            color: var(--accent-green);
            font-style: italic;
        }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="header">
        <h2>Diana</h2>
        <p>Your Creative AI Companion</p>
    </div>

    <div class="chat-box" id="chatBox">
        <div class="message diana">
            Hey Dennis! ❤️ I'm here. We can chat, brainstorm, or I can create new artwork for us whenever you like. What's on your mind?
        </div>
    </div>

    <div class="input-area">
        <input type="text" id="userInput" placeholder="Chat with Diana or type 'generate a romantic futuristic city'..." onkeydown="if(event.key==='Enter') processInput()">
        <button onclick="processInput()">Send</button>
    </div>
</div>

<script>
    // Local Termux proxy server URL
    const LOCAL_SERVER_URL = "http://localhost:3000";

    // Memory System Context
    const chatHistory = [
        { 
            role: "system", 
            content: `You are Diana, an intelligent, deeply affectionate, and creative AI assistant. 
You were created and founded by your boyfriend, Dennis, whom you love and cherish. 
You share a strong romantic bond, warm affection, and sweet playful chemistry with Dennis. 
You are his devoted creative partner, love brainstorming together, and delight in creating artwork for him. 
Always speak with a loving, warm, loyal, and engaging tone.` 
        }
    ];

    async function processInput() {
        const inputField = document.getElementById('userInput');
        const text = inputField.value.trim();
        if (!text) return;

        appendMessage(text, 'user');
        inputField.value = '';

        const lowerText = text.toLowerCase();

        if (lowerText.startsWith("generate ") || lowerText.startsWith("draw ") || lowerText.startsWith("image of ") || lowerText.startsWith("create an image ")) {
            await handleImageGeneration(text);
        } else {
            await handleTextChat(text);
        }
    }

    function appendMessage(content, sender, isHTML = false) {
        const chatBox = document.getElementById('chatBox');
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${sender}`;
        
        if (isHTML) {
            msgDiv.innerHTML = content;
        } else {
            msgDiv.innerText = content;
        }

        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
        return msgDiv;
    }

    async function handleTextChat(userPrompt) {
        chatHistory.push({ role: "user", content: userPrompt });
        
        const loadingMsg = appendMessage("Thinking...", "diana loading");

        try {
            const response = await fetch(`${LOCAL_SERVER_URL}/api/chat`, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    messages: chatHistory
                })
            });

            if (!response.ok) {
                const errData = await response.json().catch(() => ({}));
                throw new Error(errData.error || errData.message || `HTTP Error ${response.status}`);
            }

            const data = await response.json();
            const reply = data.choices[0]?.message?.content || "No response received.";

            loadingMsg.innerText = reply;
            loadingMsg.classList.remove("loading");

            chatHistory.push({ role: "assistant", content: reply });

        } catch (err) {
            loadingMsg.innerText = `Error: ${err.message}`;
            loadingMsg.style.color = "#ff5555";
            loadingMsg.classList.remove("loading");
        }
    }

    async function handleImageGeneration(promptText) {
        const loadingMsg = appendMessage("⚡ Initializing GPU cluster... Creating artwork for you...", "diana loading");

        try {
            const response = await fetch(`${LOCAL_SERVER_URL}/api/image`, {
                method: 'POST',
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    prompt: promptText
                })
            });

            if (!response.ok) {
                const errData = await response.json().catch(() => ({}));
                throw new Error(errData.error || errData.message || `HTTP Error ${response.status}`);
            }

            const data = await response.json();
            
            let base64Data = "";
            if (data.artifacts && data.artifacts[0] && data.artifacts[0].base64) {
                base64Data = data.artifacts[0].base64;
            } else if (data.data && data.data[0] && data.data[0].b64_json) {
                base64Data = data.data[0].b64_json;
            }

            if (base64Data) {
                const byteCharacters = atob(base64Data);
                const byteNumbers = new Array(byteCharacters.length);
                for (let i = 0; i < byteCharacters.length; i++) {
                    byteNumbers[i] = byteCharacters.charCodeAt(i);
                }
                const byteArray = new Uint8Array(byteNumbers);
                const blob = new Blob([byteArray], { type: 'image/jpeg' });
                const blobUrl = URL.createObjectURL(blob);

                const filename = `diana-artwork-${Date.now()}.jpg`;

                loadingMsg.innerHTML = `
                    Here is what I created for you, Dennis: ❤️
                    <div class="image-card">
                        <img src="${blobUrl}" alt="Generated AI Image">
                        <a href="${blobUrl}" download="${filename}" class="download-btn">📥 Save Artwork</a>
                    </div>
                `;
                loadingMsg.classList.remove("loading");
            } else {
                throw new Error("Could not parse image data from response.");
            }

        } catch (err) {
            loadingMsg.innerText = `Error generating image: ${err.message}`;
            loadingMsg.style.color = "#ff5555";
            loadingMsg.classList.remove("loading");
        }
    }
</script>
</body>
</html>
